<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#006491">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="עוזר משמרת">
<title>עוזר משמרת</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --head:#006491; --btn:#006491; --btn-h:#004f73; --accent:#006491;
  --red:#C8102E; --brand-red:#E31837;
  --bg:#EEF3F6; --surface:#FFFFFF; --text:#12232C; --muted:#4A5C67; --line:#C3D1D9;
  --focus:#12232C; --warn-bg:#FFF1D6; --warn-t:#6B4300; --soft:#E3F1F8;
}
:root[data-theme="dark"]{
  --head:#0B3A52; --btn:#0A7DB0; --btn-h:#1390C8; --accent:#7CCBF0;
  --bg:#0C171D; --surface:#15252E; --text:#EAF2F6; --muted:#A8BBC6; --line:#35505E;
  --focus:#FFD54A; --warn-bg:#3B2E10; --warn-t:#FFD98A; --soft:#133243;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:"Heebo",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;font-size:1rem}
h1,h2{line-height:1.25;margin:0}
p{margin:.4rem 0}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.top :focus-visible{outline-color:#fff}
.skip{position:absolute;inset-inline-start:.5rem;top:-4rem;background:#fff;color:#000;padding:.6rem 1rem;border-radius:8px;z-index:100}
.skip:focus{top:.5rem}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* header */
.top{background:var(--head);color:#fff;border-bottom:4px solid var(--brand-red);padding:.7rem 1rem;padding-top:calc(.7rem + env(safe-area-inset-top));display:flex;align-items:center;justify-content:space-between;gap:.75rem;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:.7rem}
.brand strong{display:block;font-size:1.2rem;font-weight:800}
.who{display:block;font-size:.85rem;opacity:.92}
.tools-wrap{display:flex;align-items:center;gap:.4rem}
.tools{display:flex;gap:.3rem}
.icon{min-width:2.75rem;min-height:2.75rem;border:2px solid rgba(255,255,255,.7);background:transparent;color:#fff;border-radius:8px;font:inherit;font-weight:700;cursor:pointer;padding:0 .6rem}
.icon:hover{background:rgba(255,255,255,.15)}
.icon.txt{font-weight:500}

/* nav */
.tabs{position:fixed;inset-inline:0;bottom:0;display:flex;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:20}
.tabs button{flex:1;min-height:3.5rem;border:0;border-top:3px solid transparent;background:none;color:var(--muted);font:inherit;font-weight:500;padding:.3rem .2rem;cursor:pointer}
.tabs button[aria-current="page"]{color:var(--accent);border-top-color:var(--brand-red);font-weight:700}
.count{display:inline-block;min-width:1.3rem;padding:0 .35rem;margin-inline-start:.3rem;border-radius:99px;background:var(--red);color:#fff;font-size:.75rem;font-weight:700;line-height:1.3rem}
@media (min-width:760px){
  .tabs{position:static;justify-content:center;border-top:0;border-bottom:1px solid var(--line)}
  .tabs button{flex:0 0 9rem;border-top:0;border-bottom:3px solid transparent}
  .tabs button[aria-current="page"]{border-bottom-color:var(--brand-red)}
}

/* layout */
main{max-width:46rem;margin:0 auto;padding:1rem 1rem 6.5rem}
main:focus{outline:none}
.ph{font-size:1.5rem;font-weight:800;margin-bottom:.8rem}
.lists{display:grid;gap:1rem;margin-top:1rem}
.group h2{font-size:1.1rem;margin-bottom:.4rem;color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:1rem}
.muted{color:var(--muted)}
.ltr{direction:ltr;unicode-bidi:embed;display:inline-block}
.pre{white-space:pre-wrap}
.center{min-height:60vh;display:grid;place-items:center;text-align:center;padding:1rem}
.err{color:var(--red);font-weight:700;min-height:1.4rem}
:root[data-theme="dark"] .err{color:#FF8FA0}

/* forms */
.field{display:grid;gap:.3rem;margin-bottom:.8rem}
.field label,.inline{font-weight:500}
.field small{color:var(--muted)}
input[type=text],input[type=email],input[type=password],input[type=date],select,textarea{width:100%;min-height:2.9rem;padding:.55rem .7rem;border:2px solid var(--line);border-radius:8px;background:var(--surface);color:var(--text);font:inherit}
input[type=email],input[type=password]{direction:ltr;text-align:right}
textarea{resize:vertical}
input[type=checkbox]{width:1.5rem;height:1.5rem;accent-color:var(--btn);flex:none;margin:0}
.inline{display:flex;align-items:center;gap:.6rem;margin:.4rem 0}
.row{display:flex;gap:.6rem;align-items:flex-end;flex-wrap:wrap}
.row .field{flex:1 1 12rem;margin-bottom:0}
.row.end{justify-content:flex-end;align-items:center;margin-top:1rem}
.form-card{margin-bottom:1rem}
.btn{min-height:2.9rem;padding:.55rem 1.1rem;border:2px solid var(--btn);background:var(--btn);color:#fff;border-radius:8px;font:inherit;font-weight:700;cursor:pointer}
.btn:hover{background:var(--btn-h);border-color:var(--btn-h)}
.btn:disabled{opacity:.6;cursor:default}
.btn.sec{background:transparent;color:var(--accent);border-color:var(--accent)}
.btn.sec:hover{background:var(--soft)}
.btn.warn{background:transparent;color:var(--red);border-color:var(--red)}
:root[data-theme="dark"] .btn.warn{color:#FF8FA0;border-color:#FF8FA0}
.btn.sm{min-height:2.5rem;padding:.3rem .8rem;font-size:.95rem}
.linkbtn{background:none;border:0;color:var(--accent);font:inherit;text-decoration:underline;cursor:pointer;padding:.4rem;min-height:2.75rem}

/* segmented shift choice */
.seg{display:grid;grid-template-columns:1fr 1fr;border:2px solid var(--accent);border-radius:10px;overflow:hidden}
.seg button{min-height:3rem;border:0;background:var(--surface);color:var(--accent);font:inherit;font-weight:700;cursor:pointer}
.seg button+button{border-inline-start:2px solid var(--accent)}
.seg button[aria-pressed="true"]{background:var(--btn);color:#fff}
.controls{display:grid;grid-template-columns:2fr 1fr;gap:.8rem;align-items:end;margin-bottom:1rem}
@media (max-width:480px){.controls{grid-template-columns:1fr}}

/* domino progress tile */
.tile{display:grid;grid-template-columns:1fr 3px 1fr;border:2px solid var(--accent);border-radius:14px;background:var(--surface);overflow:hidden;margin-bottom:.5rem}
.tile .half{padding:.7rem 1rem;text-align:center}
.tile .half b{display:block;font-size:2.2rem;font-weight:800;line-height:1.1}
.tile .half span{font-size:.95rem}
.tile .done{background:var(--btn);color:#fff}
.tile .mid{background:var(--accent)}
.bar{height:.55rem;border-radius:99px;background:var(--line);overflow:hidden;margin-bottom:1rem}
.bar i{display:block;height:100%;width:0;background:var(--brand-red);transition:width .25s}

/* tasks */
.tasks,.plain{list-style:none;margin:0;padding:0;display:grid;gap:.5rem}
.plain{gap:.2rem;padding-inline-start:1rem;list-style:disc}
.task{display:flex;align-items:center;gap:.4rem;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.task label{flex:1;display:flex;align-items:center;gap:.75rem;padding:.75rem .8rem;min-height:3.2rem;cursor:pointer}
.task .txt{display:grid;gap:.15rem}
.task small{color:var(--muted)}
.task.done .txt{text-decoration:line-through;color:var(--muted)}
.task.done{background:var(--soft)}
.del{border-color:transparent;color:var(--muted);margin-inline-end:.3rem}
.del{background:none}
.del:hover{color:var(--red);background:none}

/* chips and badges */
.chips{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:.4rem}
.badge{display:inline-block;padding:.1rem .6rem;border-radius:99px;font-size:.82rem;font-weight:700;background:var(--soft);color:var(--accent);border:1px solid var(--accent)}
.badge.red{background:var(--red);border-color:var(--red);color:#fff}
.badge.pin{background:var(--accent);color:var(--surface)}
.badge.warn{background:var(--warn-bg);color:var(--warn-t);border-color:var(--warn-t)}
.meta{color:var(--muted);font-size:.9rem}
.hl.urgent{border-inline-start:6px solid var(--red)}
.hl.pinned{background:var(--soft)}
.hl .row{align-items:center;margin-top:.6rem}
.user{display:grid;gap:.4rem}
.user .row{align-items:center}

.banner{background:var(--warn-bg);color:var(--warn-t);border-bottom:2px solid var(--warn-t);padding:.7rem 1rem;display:flex;gap:1rem;align-items:center;justify-content:center;flex-wrap:wrap}
.banner .btn{background:var(--warn-t);border-color:var(--warn-t);color:var(--warn-bg)}

.auth{max-width:28rem;margin:1.5rem auto}
.auth h1{font-size:1.5rem;margin-bottom:.8rem}
.auth .links{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:.6rem}

/* dialog + toast */
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--text);width:min(34rem,92vw);padding:0}
dialog::backdrop{background:rgba(0,0,0,.55)}
.dlg-in{padding:1.2rem}
.dlg-in h2{margin-bottom:.6rem}
.toast{position:fixed;inset-inline:1rem;bottom:5.5rem;max-width:30rem;margin-inline:auto;padding:.8rem 1rem;border-radius:10px;background:#12232C;color:#fff;font-weight:500;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
.toast.err{background:var(--red)}
.toast.show{opacity:1}
@media (min-width:760px){.toast{bottom:1.5rem}}
</style>
</head>
<body>
<a class="skip" href="#view">דלגו לתוכן הראשי</a>
<div id="app"></div>
<dialog id="dlg" aria-modal="true"></dialog>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<noscript><p style="padding:1rem">האתר דורש JavaScript כדי לעבוד. יש להפעיל אותו בדפדפן.</p></noscript>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {
  getAuth, onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword,
  signOut, sendPasswordResetEmail, sendEmailVerification
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {
  initializeFirestore, getFirestore, persistentLocalCache, persistentMultipleTabManager,
  doc, setDoc, updateDoc, deleteDoc, addDoc, collection, query, orderBy, limit,
  onSnapshot, getDocs, writeBatch
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

/* ---------- Firebase ---------- */
const firebaseConfig = {
  apiKey: "AIzaSyAN-r3EjazopIgenxq-85SdZryTVGuyNig",
  authDomain: "dominos-1.firebaseapp.com",
  projectId: "dominos-1",
  storageBucket: "dominos-1.firebasestorage.app",
  messagingSenderId: "346341024537",
  appId: "1:346341024537:web:fe209b04abb8aeebeddb88"
};
const ADMIN_EMAIL = "sofi.blank@gav.co.il";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
let db;
try {
  db = initializeFirestore(app, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) });
} catch (e) {
  db = getFirestore(app);
}

/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const root = $("#app");

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "html") el.innerHTML = v;
    else if (k === "value") el.value = v;
    else if (k === "checked") el.checked = !!v;
    else if (k.startsWith("on") && typeof v === "function") el.addEventListener(k.slice(2), v);
    else if (v === true) el.setAttribute(k, "");
    else el.setAttribute(k, v);
  }
  for (const kid of kids.flat(Infinity)) {
    if (kid == null || kid === false) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return el;
}

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, String(v)); } catch { /* ignore */ } }
};

const pad = n => String(n).padStart(2, "0");
function todayISO() { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
function fmtDate(iso) {
  const [y, m, d] = iso.split("-").map(Number);
  return new Date(y, m - 1, d).toLocaleDateString("he-IL", { weekday: "long", day: "numeric", month: "long" });
}
function fmtTime(ts) {
  return new Date(ts || Date.now()).toLocaleString("he-IL", { day: "numeric", month: "numeric", hour: "2-digit", minute: "2-digit" });
}
const uid8 = () => Math.random().toString(36).slice(2, 10);

const SHIFTS = { morning: "בוקר", evening: "ערב" };
const SHIFT_T = { morning: "משמרת בוקר", evening: "משמרת ערב", both: "כל המשמרות", any: "כל המשמרות" };
const ROLES = { shiftLead: 'אחמ"ש', ops: 'אחמ"ש תפעול' };
const ROLE_T = { all: "כל התפקידים", ...ROLES };

function toast(msg, kind = "ok") {
  const t = $("#toast");
  t.textContent = msg;
  t.className = "toast show" + (kind === "err" ? " err" : "");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove("show"), 4000);
}
async function safe(fn, okMsg) {
  try { await fn(); if (okMsg) toast(okMsg); }
  catch (e) { console.error(e); toast("הפעולה נכשלה. בדקו חיבור לאינטרנט והרשאות ונסו שוב.", "err"); }
}
function authMsg(e) {
  const m = {
    "auth/invalid-email": "כתובת המייל לא תקינה.",
    "auth/missing-password": "צריך להזין סיסמה.",
    "auth/weak-password": "הסיסמה חלשה מדי. נדרשים לפחות 6 תווים.",
    "auth/email-already-in-use": "כבר קיים משתמש עם המייל הזה. אפשר להתחבר או לאפס סיסמה.",
    "auth/invalid-credential": "המייל או הסיסמה שגויים.",
    "auth/user-not-found": "המייל או הסיסמה שגויים.",
    "auth/wrong-password": "המייל או הסיסמה שגויים.",
    "auth/too-many-requests": "יותר מדי ניסיונות. נסו שוב בעוד כמה דקות.",
    "auth/network-request-failed": "אין חיבור לאינטרנט."
  };
  return m[e && e.code] || "משהו השתבש. נסו שוב.";
}

const badge = (txt, cls = "") => h("span", { class: "badge " + cls }, txt);
function field(label, input) {
  if (!input.id) input.id = "f" + uid8();
  return h("div", { class: "field" }, h("label", { for: input.id }, label), input);
}
function selectEl(opts, val) {
  return h("select", {}, opts.map(([v, l]) => h("option", { value: v, selected: v === val }, l)));
}

/* ---------- preferences: text size + theme ---------- */
const SIZES = ["100%", "112%", "125%", "140%"];
let sizeIdx = Number(store.get("sa_size", "0"));
if (!(sizeIdx >= 0 && sizeIdx < SIZES.length)) sizeIdx = 0;
function applyPrefs() {
  document.documentElement.style.fontSize = SIZES[sizeIdx];
  const dark = matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.dataset.theme = store.get("sa_theme", dark ? "dark" : "light");
}
applyPrefs();
function toolsNode() {
  return h("div", { class: "tools" },
    h("button", { type: "button", class: "icon", "aria-label": "הקטנת טקסט", onclick: () => { sizeIdx = Math.max(0, sizeIdx - 1); store.set("sa_size", sizeIdx); applyPrefs(); } }, "א−"),
    h("button", { type: "button", class: "icon", "aria-label": "הגדלת טקסט", onclick: () => { sizeIdx = Math.min(SIZES.length - 1, sizeIdx + 1); store.set("sa_size", sizeIdx); applyPrefs(); } }, "א+"),
    h("button", { type: "button", class: "icon", "aria-label": "מעבר בין מצב כהה ומצב בהיר", onclick: () => { const d = document.documentElement.dataset.theme === "dark" ? "light" : "dark"; store.set("sa_theme", d); applyPrefs(); } }, "◐")
  );
}
const LOGO = '<svg viewBox="0 0 30 46" width="24" height="37" focusable="false" aria-hidden="true"><rect x="1.5" y="1.5" width="27" height="43" rx="6" fill="#fff"/><line x1="5" y1="23" x2="25" y2="23" stroke="#006491" stroke-width="2"/><circle cx="9" cy="9" r="3" fill="#E31837"/><circle cx="21" cy="15" r="3" fill="#E31837"/><circle cx="9" cy="31" r="3" fill="#006491"/><circle cx="15" cy="37" r="3" fill="#006491"/><circle cx="21" cy="31" r="3" fill="#006491"/></svg>';

/* ---------- dialog ---------- */
function openDialog(title, body) {
  const d = $("#dlg");
  d.replaceChildren(h("form", { method: "dialog", class: "dlg-in" }, h("h2", {}, title), body));
  d.showModal();
  return d;
}
function closeDialog() { const d = $("#dlg"); if (d.open) d.close(); }

/* ---------- state ---------- */
const state = {
  user: null, profile: null, isAdmin: false,
  tab: store.get("sa_tab", "checklist"),
  shift: store.get("sa_shift", new Date().getHours() < 15 ? "morning" : "evening"),
  date: todayISO(),
  fixed: [], personal: [], run: null, highlights: [], future: [], users: [], cfg: null,
  hlFilter: "active", showPast: false,
  dataOn: false, shellBuilt: false
};
let profSub = null, dataSubs = [], runUnsub = null, current = null;
let pendingSignup = null, creatingProfile = false;
const carried = new Set();

/* ---------- auth flow ---------- */
onAuthStateChanged(auth, user => {
  if (profSub) { profSub(); profSub = null; }
  stopData();
  state.user = user; state.profile = null; state.isAdmin = false; state.shellBuilt = false; current = null;
  if (!user) { showAuth("login"); return; }
  showLoading();
  profSub = onSnapshot(doc(db, "users", user.uid), handleProfile, e => {
    console.error(e);
    root.replaceChildren(h("div", { class: "center" }, h("div", {},
      h("p", { role: "alert" }, "לא ניתן לטעון את החשבון. בדקו את חיבור האינטרנט ורעננו את הדף."),
      h("button", { type: "button", class: "btn", onclick: () => location.reload() }, "רענון"))));
  });
});

async function handleProfile(snap) {
  const user = state.user;
  if (!user) return;
  state.isAdmin = (user.email || "").toLowerCase() === ADMIN_EMAIL && user.emailVerified;
  if (!snap.exists()) {
    if (creatingProfile) return;
    creatingProfile = true;
    const p = pendingSignup || {};
    try {
      await setDoc(doc(db, "users", user.uid), {
        email: user.email,
        name: (p.name || (user.email || "משתמש").split("@")[0]).slice(0, 40),
        role: p.role || "shiftLead",
        status: state.isAdmin ? "approved" : "pending",
        createdAt: Date.now(),
        fixedSeenAt: Date.now()
      });
    } catch (e) { console.error(e); toast("יצירת המשתמש נכשלה. נסו להתחבר שוב.", "err"); }
    creatingProfile = false; pendingSignup = null;
    return;
  }
  state.profile = snap.data();
  if (state.isAdmin && state.profile.status !== "approved") {
    try { await updateDoc(snap.ref, { status: "approved" }); } catch (e) { console.error(e); }
  }
  route();
}

async function refreshAdmin() {
  try { await state.user.reload(); await state.user.getIdToken(true); }
  catch (e) { toast("לא ניתן לרענן כרגע. נסו שוב.", "err"); return; }
  const u = auth.currentUser; state.user = u;
  state.isAdmin = (u.email || "").toLowerCase() === ADMIN_EMAIL && u.emailVerified;
  if (!state.isAdmin) { toast("המייל עדיין לא אומת. לחצו על הקישור במייל ונסו שוב.", "err"); return; }
  if (state.profile && state.profile.status !== "approved") {
    try { await updateDoc(doc(db, "users", u.uid), { status: "approved" }); } catch (e) { console.error(e); }
  }
  route();
}

function route() {
  const p = state.profile;
  if (!p) return;
  const member = state.isAdmin || p.status === "approved";
  if (!member) { stopData(); showPending(p.status === "blocked"); return; }
  startData();
  if (!state.shellBuilt) buildShell();
  updateChrome();
  if (!current) openTab(state.tab === "admin" && !state.isAdmin ? "checklist" : state.tab, false);
}

/* ---------- simple views ---------- */
function showLoading() {
  state.shellBuilt = false;
  root.replaceChildren(h("div", { class: "center" }, h("p", { role: "status" }, "טוען…")));
}

function authHeader() {
  return h("header", { class: "top" },
    h("div", { class: "brand" }, h("span", { html: LOGO }), h("div", {}, h("strong", {}, "עוזר משמרת"), h("span", { class: "who" }, "כלי עבודה לאחמ\"שים במוקד"))),
    toolsNode());
}

function showAuth(mode) {
  state.shellBuilt = false;
  const err = h("p", { class: "err", role: "alert" });
  const name = h("input", { type: "text", autocomplete: "name", maxlength: "40" });

/* ---------- shell ---------- */
const TABS = [["checklist", "צ'ק ליסט"], ["highlights", "דגשים"], ["fixed", "קבועות"], ["future", "עתידיות"], ["admin", "ניהול"]];

function buildShell() {
  state.shellBuilt = true; current = null;
  root.replaceChildren(
    h("header", { class: "top" },
      h("div", { class: "brand" }, h("span", { html: LOGO }), h("div", {}, h("strong", {}, "עוזר משמרת"), h("span", { class: "who", id: "who" }))),
      h("div", { class: "tools-wrap" }, toolsNode(), h("button", { type: "button", class: "icon txt", onclick: () => signOut(auth) }, "יציאה"))),
    h("div", { id: "banner" }),
    h("nav", { class: "tabs", id: "nav", "aria-label": "ניווט ראשי" }),
    h("main", { id: "view", tabindex: "-1" }));
}

function renderNav() {
  const nav = $("#nav");
  nav.dataset.admin = String(state.isAdmin);
  nav.replaceChildren(...TABS.filter(([k]) => k !== "admin" || state.isAdmin).map(([k, label]) =>
    h("button", { type: "button", id: "tab-" + k, onclick: () => openTab(k, true) }, label, h("span", { class: "count", id: "bd-" + k, hidden: true }))));
}

function unreadCount() {
  const uid = state.user.uid;
  return state.highlights.filter(x => !x.resolved && x.authorUid !== uid && !(x.ackBy && x.ackBy[uid])).length;
}

function updateChrome() {
  if (!state.shellBuilt || !state.profile) return;
  const nav = $("#nav");
  if (nav.dataset.admin !== String(state.isAdmin) || !nav.children.length) renderNav();
  $("#who").textContent = `${state.profile.name || ""}, ${ROLES[state.profile.role] || ""}`;
  const setCount = (k, n) => {
    const el = $("#bd-" + k); if (!el) return;
    el.hidden = !(n > 0); el.textContent = n > 0 ? String(n) : "";
    const tab = $("#tab-" + k);
    if (tab) tab.setAttribute("aria-label", n > 0 ? `${TABS.find(t => t[0] === k)[1]}, ${n} חדשים` : TABS.find(t => t[0] === k)[1]);
  };
  setCount("highlights", unreadCount());
  setCount("admin", state.isAdmin ? state.users.filter(u => u.status === "pending").length : 0);
  TABS.forEach(([k]) => { const b = $("#tab-" + k); if (b) { if (k === state.tab) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current"); } });

  const b = $("#banner");
  const upd = (state.cfg && state.cfg.updatedAt) || 0;
  const seen = state.profile.fixedSeenAt || 0;
  const key = (!state.isAdmin && upd > seen) ? String(upd) : "";
  if (b.dataset.k !== key) {
    b.dataset.k = key;
    if (key) {
      b.replaceChildren(h("div", { class: "banner", role: "status" },
        h("span", {}, "עודכנו המשימות הקבועות" + (state.cfg.summary ? ": " + state.cfg.summary : "")),
        h("button", { type: "button", class: "btn sm", onclick: () => safe(() => updateDoc(doc(db, "users", state.user.uid), { fixedSeenAt: Date.now() })) }, "הבנתי")));
    } else b.replaceChildren();
  }
}

function openTab(name, userAction) {
  if (name === "admin" && !state.isAdmin) name = "checklist";
  state.tab = name; store.set("sa_tab", name);
  const impl = { checklist: checklistTab, highlights: highlightsTab, fixed: fixedTab, future: futureTab, admin: adminTab }[name];
  current = impl();
  $("#view").replaceChildren(current.node);
  if (current.update) current.update();
  updateChrome();
  if (userAction) $("#view").focus({ preventScroll: true });
}

function refresh() {
  if (current && current.update) current.update();
  updateChrome();
}

/* ---------- data subscriptions ---------- */
function errH(e) { console.error(e); toast("שגיאת חיבור או הרשאה. נסו לרענן את הדף.", "err"); }
function dsub(u) { dataSubs.push(u); }
const rows = s => s.docs.map(d => ({ id: d.id, ...d.data() }));

function startData() {
  if (state.dataOn) return;
  state.dataOn = true;
  const uid = state.user.uid;
  dsub(onSnapshot(collection(db, "fixedTasks"), s => { state.fixed = rows(s).sort((a, b) => (a.order || 0) - (b.order || 0)); refresh(); }, errH));
  dsub(onSnapshot(doc(db, "config", "fixed"), s => { state.cfg = s.exists() ? s.data() : null; updateChrome(); }, errH));
  dsub(onSnapshot(collection(db, "users", uid, "personalTasks"), s => { state.personal = rows(s).sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0)); refresh(); }, errH));
  dsub(onSnapshot(query(collection(db, "highlights"), orderBy("createdAt", "desc"), limit(100)), s => { state.highlights = rows(s); refresh(); }, errH));
  dsub(onSnapshot(collection(db, "future"), s => { state.future = rows(s); refresh(); }, errH));
  if (state.isAdmin) dsub(onSnapshot(collection(db, "users"), s => { state.users = rows(s); refresh(); }, errH));
  subscribeRun();
}
function stopData() {
  dataSubs.forEach(u => u()); dataSubs = [];
  if (runUnsub) { runUnsub(); runUnsub = null; }
  state.dataOn = false; state.run = null;
}

const runId = () => `${state.date}_${state.shift}`;
const runRef = () => doc(db, "users", state.user.uid, "runs", runId());

function subscribeRun() {
  if (runUnsub) { runUnsub(); runUnsub = null; }
  state.run = null;
  const id = runId(), ref = runRef();
  runUnsub = onSnapshot(ref, async s => {
    if (!s.exists()) {
      state.run = { done: {}, oneTime: [] };
      refresh();
      if (!carried.has(id)) {
        carried.add(id);
        try {
          const c = await findCarry();
          if (c.length) await setDoc(ref, { date: state.date, shift: state.shift, done: {}, oneTime: c }, { merge: true });
        } catch (e) { console.error(e); }
      }
      return;
    }
    const r = s.data();
    state.run = { ...r, done: r.done || {}, oneTime: r.oneTime || [] };
    refresh();
  }, errH);
}

async function findCarry() {
  const q = query(collection(db, "users", state.user.uid, "runs"), orderBy("date", "desc"), limit(14));
  const s = await getDocs(q);
  for (const d of s.docs) {
    const r = d.data();
    if (r.shift === state.shift && r.date < state.date) {
      return (r.oneTime || []).filter(t => !t.done).map(t => ({ id: uid8(), title: t.title, done: false, carried: true }));
    }
  }
  return [];
}

async function saveRun(patch) {
  await safe(() => setDoc(runRef(), { date: state.date, shift: state.shift, ...patch }, { merge: true }));
}

/* ---------- checklist ---------- */
function checklistItems() {
  const s = state.shift, role = state.profile.role, out = [];
  state.fixed.filter(t => (t.shift === "both" || t.shift === s) && (t.role === "all" || t.role === role))
    .forEach(t => out.push({ key: "f_" + t.id, title: t.title, kind: "fixed" }));
  state.personal.filter(t => t.shift === "both" || t.shift === s)
    .forEach(t => out.push({ key: "p_" + t.id, title: t.title, kind: "personal" }));
  state.future.filter(t => t.date === state.date && (t.shift === "both" || t.shift === s))
    .forEach(t => out.push({ key: "u_" + t.id, title: t.title, kind: "future", note: t.notes }));
  ((state.run && state.run.oneTime) || []).forEach(t => out.push({ key: "o_" + t.id, id: t.id, title: t.title, kind: "one", done: t.done, carried: t.carried }));
  return out;
}
const isDone = i => i.kind === "one" ? !!i.done : !!(state.run && state.run.done[i.key]);

function toggleItem(item, val) {
  if (!state.run) return;
  if (item.kind === "one") saveRun({ oneTime: state.run.oneTime.map(t => t.id === item.id ? { ...t, done: val } : t) });
  else saveRun({ done: { [item.key]: val } });
}

function checklistTab() {
  const doneNum = h("b", {}, "0"), leftNum = h("b", {}, "0");
  const bar = h("i", {});
  const barWrap = h("div", { class: "bar", role: "progressbar", "aria-label": "התקדמות במשמרת", "aria-valuemin": "0", "aria-valuemax": "100", "aria-valuenow": "0" }, bar);
  const tile = h("div", { class: "tile" },
    h("div", { class: "half done" }, doneNum, h("span", {}, "בוצעו")),
    h("div", { class: "mid" }),
    h("div", { class: "half" }, leftNum, h("span", {}, "נשארו")));
  const list = h("div", { class: "lists" });

  const seg = h("div", { class: "seg", role: "group", "aria-label": "בחירת משמרת" },
    ["morning", "evening"].map(k => h("button", {
      type: "button", "aria-pressed": String(state.shift === k),
      onclick: () => { state.shift = k; store.set("sa_shift", k); subscribeRun(); openTab("checklist", false); }
    }, SHIFT_T[k])));
  const dateIn = h("input", {
    type: "date", value: state.date,
    onchange: e => { state.date = e.target.value || todayISO(); subscribeRun(); openTab("checklist", false); }
  });

  const oneIn = h("input", { type: "text", maxlength: "120", autocomplete: "off" });
  const addForm = h("form", {
    class: "card form-card row",
    onsubmit: e => {
      e.preventDefault();
      const t = oneIn.value.trim();
      if (!t || !state.run) return;
      oneIn.value = "";
      saveRun({ oneTime: [...state.run.oneTime, { id: uid8(), title: t, done: false }] });
    }
  }, field("משימה חד־פעמית למשמרת הזו", oneIn), h("button", { type: "submit", class: "btn" }, "הוספה"));

  const node = h("section", {},
    h("h1", { class: "ph" }, "צ'ק ליסט משמרת"),
    h("div", { class: "controls" }, h("div", {}, h("p", { class: "meta" }, "משמרת"), seg), field("תאריך", dateIn)),
    tile, barWrap, list, addForm,
    h("div", { class: "row end" }, h("button", { type: "button", class: "btn sec", onclick: openEndShift }, "סיום משמרת וסיכום")));

  function taskLi(item) {
    const d = isDone(item);
    return h("li", { class: "task" + (d ? " done" : "") },
      h("label", {},
        h("input", { type: "checkbox", checked: d, "data-key": item.key, onchange: e => toggleItem(item, e.target.checked) }),
        h("span", { class: "txt" }, item.title, item.note ? h("small", {}, item.note) : null, item.carried ? badge("הועברה ממשמרת קודמת", "warn") : null)),
      item.kind === "one" ? h("button", {
        type: "button", class: "icon del", "aria-label": "מחיקת המשימה " + item.title,
        onclick: () => saveRun({ oneTime: state.run.oneTime.filter(t => t.id !== item.id) })
      }, "✕") : null);
  }

  function update() {
    if (!state.run) { list.replaceChildren(h("p", { class: "muted" }, "טוען…")); return; }
    const active = document.activeElement;
    const focusKey = active && active.dataset ? active.dataset.key : null;
    const items = checklistItems();
    const done = items.filter(isDone).length, total = items.length;
    doneNum.textContent = done; leftNum.textContent = total - done;
    const pct = total ? Math.round(done / total * 100) : 0;
    bar.style.width = pct + "%";

    const groups = [["fixed", "משימות קבועות"], ["personal", "המשימות הקבועות שלי"], ["future", "מתוכנן ליום הזה"], ["one", "חד־פעמיות"]];

    list.replaceChildren(...parts);
    if (focusKey) { const n = list.querySelector(`[data-key="${CSS.escape(focusKey)}"]`); if (n) n.focus(); }
  }
  return { node, update };
}

        (!acked && !mine && !x.resolved) ? h("button", { type: "button", class: "btn sm", onclick: () => safe(() => updateDoc(ref, { ["ackBy." + uid]: state.profile.name })) }, "קראתי") : null,
        can ? h("button", { type: "button", class: "btn sm sec", onclick: () => safe(() => updateDoc(ref, { pinned: !x.pinned })) }, x.pinned ? "ביטול נעיצה" : "נעיצה") : null,
        can ? h("button", { type: "button", class: "btn sm sec", onclick: () => safe(() => updateDoc(ref, { resolved: !x.resolved })) }, x.resolved ? "החזרה לפעילים" : "סימון כטופל") : null,
        can ? h("button", { type: "button", class: "btn sm warn", onclick: () => { if (confirm("למחוק את הדגש?")) safe(() => deleteDoc(ref), "הדגש נמחק"); } }, "מחיקה") : null));
  }

  function update() {
    filterBtns.forEach(b => b.setAttribute("aria-pressed", String(b.dataset.f === state.hlFilter)));
    const want = state.hlFilter === "resolved";
    const items = state.highlights.filter(x => !!x.resolved === want)
      .sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0) || (b.createdAt || 0) - (a.createdAt || 0));
    list.replaceChildren(...(items.length ? items.map(card) : [h("div", { class: "card" }, h("p", {}, want ? "אין דגשים שטופלו." : "אין דגשים פעילים כרגע."))]));
  }
  return { node, update };
}

/* ---------- fixed tasks ---------- */
const touchFixed = summary => setDoc(doc(db, "config", "fixed"), { updatedAt: Date.now(), summary });

function openEditFixed(t) {
  const title = h("input", { type: "text", maxlength: "120", value: t.title });
  const shift = selectEl([["both", "כל המשמרות"], ["morning", "משמרת בוקר"], ["evening", "משמרת ערב"]], t.shift);
  const role = selectEl(Object.entries(ROLE_T), t.role);
  openDialog("עריכת משימה קבועה", h("div", {},
    field("שם המשימה", title), field("משמרת", shift), field("תפקיד", role),
    h("div", { class: "row end" },
      h("button", {
        type: "button", class: "btn",
        onclick: async () => {
          const v = title.value.trim();
          if (!v) { title.focus(); return; }
          await safe(async () => {
            await updateDoc(doc(db, "fixedTasks", t.id), { title: v, shift: shift.value, role: role.value });
            await touchFixed("עודכנה משימה: " + v);
          }, "המשימה עודכנה");
          closeDialog();
        }
      }, "שמירה"),
      h("button", { class: "btn sec", value: "cancel" }, "ביטול"))));
}

function fixedTab() {
  const sharedList = h("div", { class: "lists" });
  const personalList = h("div", { class: "lists" });
  const parts = [h("h1", { class: "ph" }, "משימות קבועות")];

  if (state.isAdmin) {
    const title = h("input", { type: "text", maxlength: "120" });
    const shift = selectEl([["both", "כל המשמרות"], ["morning", "משמרת בוקר"], ["evening", "משמרת ערב"]], "both");
    const role = selectEl(Object.entries(ROLE_T), "all");
    parts.push(h("form", {
      class: "card form-card",
      onsubmit: e => {
        e.preventDefault();
        const v = title.value.trim();
        if (!v) { title.focus(); return; }
        safe(async () => {
          await addDoc(collection(db, "fixedTasks"), { title: v, shift: shift.value, role: role.value, order: Date.now(), createdAt: Date.now() });
          await touchFixed("נוספה משימה: " + v);
          title.value = "";
        }, "המשימה נוספה לכולם");
      }
    },
      h("h2", {}, "הוספת משימה קבועה לכולם"),
      field("שם המשימה", title), field("משמרת", shift), field("תפקיד", role),
      h("div", { class: "row end" }, h("button", { type: "submit", class: "btn" }, "הוספה"))));
  } else {
    parts.push(h("p", { class: "muted" }, "המשימות המשותפות מוגדרות על ידי מנהל/ת האתר ומופיעות אצל כולם."));
  }
  parts.push(sharedList);

  const ptitle = h("input", { type: "text", maxlength: "120" });
  const pshift = selectEl([["both", "כל המשמרות"], ["morning", "משמרת בוקר"], ["evening", "משמרת ערב"]], "both");
  parts.push(h("h1", { class: "ph" }, "המשימות הקבועות שלי"),
    h("p", { class: "muted" }, "משימות שרק אתם רואים, ומופיעות בצ'ק ליסט שלכם."),
    h("form", {
      class: "card form-card",
      onsubmit: e => {
        e.preventDefault();
        const v = ptitle.value.trim();
        if (!v) { ptitle.focus(); return; }
        safe(async () => {
          await addDoc(collection(db, "users", state.user.uid, "personalTasks"), { title: v, shift: pshift.value, createdAt: Date.now() });
          ptitle.value = "";
        }, "המשימה נוספה");
      }
    }, field("שם המשימה", ptitle), field("משמרת", pshift), h("div", { class: "row end" }, h("button", { type: "submit", class: "btn" }, "הוספה"))),
    personalList);

  const node = h("section", {}, parts);

  async function move(group, idx, dir) {
    const a = group[idx], b = group[idx + dir];
    if (!b) return;
    await safe(async () => {
      const batch = writeBatch(db);
      batch.update(doc(db, "fixedTasks", a.id), { order: b.order || 0 });
      batch.update(doc(db, "fixedTasks", b.id), { order: a.order || 0 });
      await batch.commit();
    });
  }

  function update() {
    const groups = [["both", "כל המשמרות"], ["morning", "משמרת בוקר"], ["evening", "משמרת ערב"]];
    const out = [];
    for (const [k, label] of groups) {
      const group = state.fixed.filter(t => t.shift === k);
      if (!group.length) continue;
      out.push(h("section", { class: "group" }, h("h2", {}, label), h("ul", { class: "tasks" }, group.map((t, i) =>
        h("li", { class: "task" },
          h("div", { class: "txt", style: "flex:1;padding:.75rem .8rem" }, t.title, h("div", { class: "chips" }, badge(ROLE_T[t.role] || ROLE_T.all))),
          state.isAdmin ? h("div", { class: "row", style: "padding:.4rem;align-items:center" },
            h("button", { type: "button", class: "icon del", "aria-label": "הזזה למעלה: " + t.title, disabled: i === 0, onclick: () => move(group, i, -1) }, "↑"),
            h("button", { type: "button", class: "icon del", "aria-label": "הזזה למטה: " + t.title, disabled: i === group.length - 1, onclick: () => move(group, i, 1) }, "↓"),
            h("button", { type: "button", class: "btn sm sec", "aria-label": "עריכת " + t.title, onclick: () => openEditFixed(t) }, "עריכה"),
            h("button", {
              type: "button", class: "btn sm warn", "aria-label": "מחיקת " + t.title,
              onclick: () => { if (confirm("למחוק את המשימה הקבועה לכולם?")) safe(async () => { await deleteDoc(doc(db, "fixedTasks", t.id)); await touchFixed("הוסרה משימה: " + t.title); }, "המשימה נמחקה"); }
            }, "מחיקה")) : null)))));
    }
    if (!out.length) out.push(h("div", { class: "card" }, h("p", {}, "עדיין לא הוגדרו משימות קבועות משותפות.")));
    sharedList.replaceChildren(...out);

    const mine = state.personal;
    personalList.replaceChildren(...(mine.length
      ? [h("ul", { class: "tasks" }, mine.map(t => h("li", { class: "task" },
          h("div", { class: "txt", style: "flex:1;padding:.75rem .8rem" }, t.title, h("div", { class: "chips" }, badge(SHIFT_T[t.shift] || SHIFT_T.both))),
          h("button", {
            type: "button", class: "icon del", "aria-label": "מחיקת המשימה " + t.title,
            onclick: () => { if (confirm("למחוק את המשימה?")) safe(() => deleteDoc(doc(db, "users", state.user.uid, "personalTasks", t.id))); }
          }, "✕"))))]
      : [h("div", { class: "card" }, h("p", {}, "עדיין אין לכם משימות קבועות אישיות."))]));
  }
  return { node, update };
}

/* ---------- future tasks ---------- */
function futureTab() {
  const title = h("input", { type: "text", maxlength: "120" });
  const date = h("input", { type: "date", value: state.date });
  const shift = selectEl([["both", "כל המשמרות"], ["morning", "משמרת בוקר"], ["evening", "משמרת ערב"]], "both");
  const notes = h("input", { type: "text", maxlength: "200" });
  const list = h("div", { class: "lists" });
  const togglePast = h("button", { type: "button", class: "btn sec", onclick: () => { state.showPast = !state.showPast; update(); } });

  const form = h("form", {
    class: "card form-card",
    onsubmit: e => {
      e.preventDefault();
      const v = title.value.trim();
      if (!v) { title.focus(); return; }
      if (!date.value) { date.focus(); return; }
      safe(async () => {
        await addDoc(collection(db, "future"), {
          title: v, date: date.value, shift: shift.value, notes: notes.value.trim(),
          createdBy: state.user.uid, createdByName: state.profile.name, createdAt: Date.now()
        });
        title.value = ""; notes.value = "";
      }, "המשימה העתידית נשמרה");
    }
  },
    field("מה צריך לעשות", title), field("תאריך", date), field("משמרת", shift), field("הערה (לא חובה)", notes),
    h("div", { class: "row end" }, h("button", { type: "submit", class: "btn" }, "שמירה")));

  const node = h("section", {}, h("h1", { class: "ph" }, "משימות עתידיות"),
    h("p", { class: "muted" }, "משימה שנשמרה כאן תופיע אוטומטית בצ'ק ליסט של היום המתאים."), form, list);

  function card(x) {
    const can = x.createdBy === state.user.uid || state.isAdmin;
    return h("article", { class: "card" },
      h("div", { class: "chips" }, x.date === todayISO() ? badge("היום", "pin") : null, badge(SHIFT_T[x.shift] || SHIFT_T.both)),
      h("strong", {}, fmtDate(x.date)),
      h("p", {}, x.title),
      x.notes ? h("p", { class: "meta" }, x.notes) : null,
      h("p", { class: "meta" }, "נוסף על ידי " + (x.createdByName || "משתמש")),
      can ? h("div", { class: "row", style: "margin-top:.5rem" },
        h("button", { type: "button", class: "btn sm warn", onclick: () => { if (confirm("למחוק את המשימה העתידית?")) safe(() => deleteDoc(doc(db, "future", x.id)), "המשימה נמחקה"); } }, "מחיקה")) : null);
  }

  function update() {
    const today = todayISO();
    const up = state.future.filter(f => f.date >= today).sort((a, b) => a.date.localeCompare(b.date) || (a.createdAt || 0) - (b.createdAt || 0));
    const past = state.future.filter(f => f.date < today).sort((a, b) => b.date.localeCompare(a.date));
    togglePast.textContent = state.showPast ? "הסתרת משימות שעברו" : `הצגת משימות שעברו (${past.length})`;
    const parts = [h("section", { class: "group" }, h("h2", {}, "קרובות"),
      up.length ? h("div", { class: "lists", style: "margin-top:.4rem" }, up.map(card)) : h("div", { class: "card" }, h("p", {}, "אין משימות עתידיות שמורות.")))];
    if (past.length) parts.push(togglePast);
    if (state.showPast) parts.push(h("section", { class: "group" }, h("h2", {}, "עברו"), h("div", { class: "lists", style: "margin-top:.4rem" }, past.map(card))));
    list.replaceChildren(...parts);
  }
  return { node, update };
}

/* ---------- admin ---------- */
function adminTab() {
  const list = h("div", { class: "lists" });
  const node = h("section", {}, h("h1", { class: "ph" }, "ניהול משתמשים"),
    h("p", { class: "muted" }, "משתמשים חדשים נשארים ממתינים עד שתאשרו אותם. כדי למחוק חשבון לגמרי יש למחוק אותו גם ב-Firebase, תחת Authentication."),
    list);

  function userCard(u) {
    const self = u.id === state.user.uid;
    const ref = doc(db, "users", u.id);
    const sel = selectEl(Object.entries(ROLES), u.role);
    sel.setAttribute("aria-label", "תפקיד של " + (u.name || "המשתמש"));
    sel.addEventListener("change", () => safe(() => updateDoc(ref, { role: sel.value }), "התפקיד עודכן"));
    return h("article", { class: "card user" },
      h("strong", {}, u.name || "ללא שם", self ? " (אתם)" : ""),
      h("span", { class: "ltr muted" }, u.email || ""),
      h("div", { class: "row" },
        h("div", { class: "field" }, h("label", {}, "תפקיד"), sel),
        !self && u.status !== "approved" ? h("button", { type: "button", class: "btn sm", onclick: () => safe(() => updateDoc(ref, { status: "approved" }), "המשתמש אושר") }, "אישור כניסה") : null,
        !self && u.status !== "blocked" ? h("button", { type: "button", class: "btn sm sec", onclick: () => safe(() => updateDoc(ref, { status: "blocked" }), "המשתמש נחסם") }, "חסימה") : null,
        !self ? h("button", { type: "button", class: "btn sm warn", onclick: () => { if (confirm("להסיר את המשתמש מהרשימה?")) safe(() => deleteDoc(ref), "המשתמש הוסר"); } }, "הסרה") : null));
  }

  function update() {
    const byName = (a, b) => (a.name || "").localeCompare(b.name || "", "he");
    const sections = [["pending", "ממתינים לאישור"], ["approved", "משתמשים מאושרים"], ["blocked", "חסומים"]];
    const out = [];
    for (const [st, label] of sections) {
      const us = state.users.filter(u => u.status === st).sort(byName);
      if (!us.length) continue;
      out.push(h("section", { class: "group" }, h("h2", {}, `${label} (${us.length})`), h("div", { class: "lists", style: "margin-top:.4rem" }, us.map(userCard))));
    }
    if (!out.length) out.push(h("div", { class: "card" }, h("p", {}, "עדיין אין משתמשים.")));
    list.replaceChildren(...out);
  }
  return { node, update };
}
</script>
</body>
</html>
